name: selftext
description: "SelfText conversational personal productivity app."
publish_to: 'none'
version: 1.0.0-rc.4+19

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
  http: ^1.5.0
  flutter_secure_storage: ^9.2.4
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  cryptography: ^2.9.0
  file_saver: ^0.3.1
  url_launcher: ^6.3.2
  flutter_local_notifications:
    path: vendor/flutter_local_notifications
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: DancingScript
      fonts:
        - asset: assets/fonts/DancingScript.ttf
